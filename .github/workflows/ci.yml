name: CPU reproducibility
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/verify_artifacts.py
      - run: pytest -q
      - run: python scripts/reproduce_statistics.py --output results/derived/reproduced.json
